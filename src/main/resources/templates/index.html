<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="layout/default_layout">
<meta charset="UTF-8">
<th:block layout:fragment="content">
    <div class="container mt-5">
        <!--    <div class="mt-3">-->
        <!--      <a href="/app-logout" class="btn btn-danger">Logout</a>-->
        <!--    </div>-->

        <h2>User List</h2>
        <table class="table table-striped">
            <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Email</th>
                <th scope="col">Edit</th>
                <th scope="col">Delete</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.name}"></td>
                <td th:text="${user.email}"></td>
                <td><a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-outline-primary">Edit</a></td>
                <td><a th:href="@{/users/delete/{id}(id=${user.id})}" class="btn btn-sm btn-outline-danger" onclick="return confirm('Are you sure you want to delete this user?')">Delete</a></td>
            </tr>
            <tbody>
        </table>
        <div class="mt-5">
            <a href="/users/signup" class="btn btn-primary">Register</a>
        </div>

    </div>
</th:block>
</html>
