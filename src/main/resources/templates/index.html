<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="layout/default_layout">
<meta charset="UTF-8">
<th:block layout:fragment="content">
    <div class="container mt-5">
        <!-- 비밀번호 변경 등 성공 메시지 (flash) -->
        <div class="alert alert-success" role="alert" th:if="${msg}" th:text="${msg}"></div>

        <h2>User List</h2>
        <table class="table table-striped">
            <thead>
            <tr>
                <th scope="col">Name</th>
                <th scope="col">Email</th>
                <th scope="col">Edit</th>
                <th scope="col">Delete</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
                <td th:text="${user.name}"></td>
                <td th:text="${user.email}"></td>
                <td><a th:href="@{/users/edit/{id}(id=${user.id})}" class="btn btn-sm btn-outline-primary">Edit</a></td>
                <td>
                    <!-- [CSRF 하드닝] 삭제는 POST 폼으로: Thymeleaf 가 hidden _csrf 토큰을 자동 삽입한다 -->
                    <form th:action="@{/users/delete/{id}(id=${user.id})}" method="post" style="display:inline"
                          onsubmit="return confirm('Are you sure you want to delete this user?')">
                        <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="mt-5">
            <a href="/users/signup" class="btn btn-primary">Register</a>
            <!-- [교육용] XSS(Stored) 공격 재현 전용 페이지로 이동 -->
            <a href="/users/index-vuln" class="btn btn-outline-danger">⚠️ XSS 데모(취약)</a>
        </div>

        <!-- [교육용] 보안 설정 오류(Security Misconfiguration) 데모 - Actuator 노출 확인
             health/info 는 누구나 접근 가능(permitAll), 나머지는 ROLE_ADMIN 세션 인증이 있어야 200,
             없으면 403(AUDIT 로그 기록)이 되는지 직접 눌러서 확인한다. -->
        <div class="mt-4">
            <h5>⚠️ 보안 설정 오류 데모 — Actuator 엔드포인트</h5>
            <ul>
                <li><a th:href="@{/actuator/health}" target="_blank">/actuator/health</a> (인증 불필요)</li>
                <li><a th:href="@{/actuator/env}" target="_blank">/actuator/env</a> (ROLE_ADMIN 필요)</li>
                <li><a th:href="@{/actuator/beans}" target="_blank">/actuator/beans</a> (ROLE_ADMIN 필요)</li>
                <li><a th:href="@{/actuator/mappings}" target="_blank">/actuator/mappings</a> (ROLE_ADMIN 필요)</li>
            </ul>
        </div>

    </div>
</th:block>
</html>
