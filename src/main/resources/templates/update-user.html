<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" layout:decorate="layout/default_layout">
<th:block layout:fragment="content">
    <div class="container mt-5">
        <h2>User - Update</h2>
        <form action="#" th:action="@{/users/update/{id}(id=${userForm.id})}" th:object="${userForm}" method="post">
            <label for="name">Name</label>
            <input type="text" th:field="*{name}" id="name">
            <span th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span> <br />
            <label for="email">Email</label>
            <input type="text" th:field="*{email}" id="email" readonly>
            <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span> <br />
            <input type="submit" value="Update User">
        </form>
    </div>
</th:block>
</html>
