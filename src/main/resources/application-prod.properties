myboot.name=Prod Env

logging.level.com.basic.myspringboot=info

# mariadb db info
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/boot_db
spring.datasource.username=boot
spring.datasource.password=boot
spring.datasource.driverClassName=org.mariadb.jdbc.Driver

# hibernate info
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MariaDBDialect

# [\uC2DC\uAC04\uB300 \uD558\uB4DC\uB2DD] Instant(UTC) \uAC12\uC744 DB TIMESTAMP \uCEEC\uB7FC\uC5D0 \uC800\uC7A5/\uC870\uD68C\uD560 \uB54C KST(Asia/Seoul) \uAE30\uC900\uC73C\uB85C \uBCC0\uD658\uD55C\uB2E4.
#   \uBBF8\uC9C0\uC815 \uC2DC JVM \uAE30\uBCF8 \uC2DC\uAC04\uB300\uB85C \uBCC0\uD658\uB418\uB294\uB370, \uC11C\uBC84 \uD658\uACBD\uC5D0 \uB530\uB77C UTC \uAC00 \uAE30\uBCF8\uAC12\uC77C \uC218 \uC788\uC5B4
#   DB \uC5D0\uC11C \uC9C1\uC811 \uC870\uD68C\uD55C expires_at \uB4F1\uC774 \uB85C\uCEEC \uC2DC\uAC01\uBCF4\uB2E4 9\uC2DC\uAC04 \uC774\uB974\uAC8C \uBCF4\uC77C \uC218 \uC788\uB2E4.
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

#logging.level.org.hibernate.SQL=DEBUG
#logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# \uD55C \uBC88\uC5D0 \uAC00\uC838\uC62C \uC5F0\uAD00\uB41C \uAC1D\uCCB4(\uC790\uC2DD \uAC1D\uCCB4)\uC758 \uC218
spring.jpa.properties.hibernate.default_batch_fetch_size=100