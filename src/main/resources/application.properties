spring.application.name=MySpringBootApp
# port 번호 변경
#server.port=8085

# 사용자가 정의한 환경변수
myboot.age=${random.int(1,100)}
myboot.fullName=${myboot.name} Boot

# 현재 활성화된 환경을 나타내는 문자열설정
spring.profiles.active=prod

# log file
logging.file.path=logs

# [보안 감사 로깅] (OWASP #9) - 인증 이벤트/접근 거부 감사 로그가 항상 출력되도록 레벨 지정
# 주의: 비밀번호·JWT 등 민감정보는 로그에 남기지 않는다(코드에서 마스킹 처리)
logging.level.com.basic.myspringboot.security.logging=INFO
logging.level.com.basic.myspringboot.exception.advice=INFO

# [예외 처리 하드닝] (OWASP #10) - Spring Boot 기본 오류 처리기(@ControllerAdvice 미포착 오류)의 노출 차단
# 최신 Spring Boot 기본값이 이미 never 이지만, 의도를 명시한다.
# (@RestControllerAdvice 로 처리되는 예외는 코드에서 일반 메시지+traceId 로 별도 하드닝)
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# CORS 허용 Origin ( 쉼표로 구분, 프론트엔드 개발서버 주소 )
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173,http://127.0.0.1:5500

# JWT 설정
# 실습용 기본값이며, 운영에서는 환경변수 JWT_SECRET 으로 주입한다 ( HS256 은 32바이트 이상 필요 )
jwt.secret=${JWT_SECRET:5367566B59703373367639792F423F4528482B4D6251655468576D5A71347437}
# 액세스 토큰 만료 시간 ( 초 ) - 3600초 = 60분 (운영 권장: 짧게 5~15분)
jwt.access-expire-seconds=3600
# [2단계] Refresh 토큰 만료 시간 ( 초 ) - 1209600초 = 14일
jwt.refresh-expire-seconds=${JWT_REFRESH_EXPIRE_SECONDS:1209600}
# [JWT 보안 실습] 약한/기본 secret 사용 허용 여부.
#   true  : (실습·취약 데모용) 커밋된 기본 secret 으로도 기동 → 토큰 위조 시연 가능
#   false : (안전/운영) 약한·기본 secret 이면 기동 실패(fail-closed). 반드시 JWT_SECRET 주입
# 운영에서는 절대 true 로 두지 말 것.
jwt.allow-insecure-secret=${JWT_ALLOW_INSECURE_SECRET:true}
